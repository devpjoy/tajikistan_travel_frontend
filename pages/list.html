<!-- list.html -->
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Tajikistan</title>

    <!-- for google material icon -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/list.css" />
    <link rel="stylesheet" href="../css/footer.css" />

    <script src="../js/include.js" defer></script>
</head>

<body>
    <!-- header -->
    <div data-include="../components/header.html"></div>

    <!-- List Page -->
    <main class="list-page">
        <div class="list-container">
            <!-- Title -->
            <header class="list-header">
                <h1 class="list-title">Explore Tajikistan</h1>
            </header>

            <!-- Filters -->
            <section class="filter-panel" aria-label="Search filters">
                <form class="filter-form" action="#" method="get">
                    <!-- Search input -->
                    <div class="filter-input">
                        <span class="material-icons" aria-hidden="true">search</span>
                        <input type="text" name="q" placeholder="Where do you want to go?"
                            aria-label="Search keyword" />
                    </div>

                    <!-- Category select -->
                    <div class="filter-select-wrap" aria-label="Select category">
                        <select class="filter-select" name="category">
                            <option value="" selected>All Categories</option>
                            <option value="stays">Stays</option>
                            <option value="dining">Dining</option>
                            <option value="parks">Parks</option>
                        </select>
                        <span class="material-icons select-icon" aria-hidden="true">expand_more</span>
                    </div>

                    <!-- Region select -->
                    <div class="filter-select-wrap" aria-label="Select region">
                        <select class="filter-select" name="region">
                            <option value="" selected>All Regions</option>
                            <option value="Dushanbe">Dushanbe</option>
                            <option value="Sughd Region">Sughd Region</option>
                            <option value="Khatlon">Khatlon</option>
                            <option value="Gorno-Badakhshan Autonomous Province">Gorno-Badakhshan Autonomous Province
                            </option>
                            <option value="Districts of Republican Subordination">Districts of Republican Subordination
                            </option>
                        </select>
                        <span class="material-icons select-icon" aria-hidden="true">expand_more</span>
                    </div>

                    <!-- Search button -->
                    <button type="submit" class="filter-submit">Search</button>
                </form>
            </section>

            <!-- Results -->
            <section class="results" aria-label="Search results">
                <div class="results-meta">
                    <h2 class="results-count">15 Results</h2>
                </div>

                <!-- Cards grid (mock: ONLY ONE CARD for now) -->
                <div class="card-grid">
                    <article class="place-card">
                        <div class="place-thumb">
                            <img src="../assets/images/home_reg_2.png" alt="Iskanderkul Lake" />
                            <span class="badge badge-top">Nature</span>
                        </div>

                        <div class="place-body">
                            <h3 class="place-title">Iskanderkul Lake</h3>
                            <p class="place-desc">
                                A stunning glacial lake in the Fann Mountains. Known for its turquoise color and serene
                                atmosphere, perfect for hiking and photography.
                            </p>

                            <div class="place-tags">
                                <span class="badge badge-bottom">
                                    <span class="material-icons" aria-hidden="true">location_on</span>
                                    Sughd Region
                                </span>
                            </div>
                        </div>
                    </article>
                </div>

                <!-- Pagination (mock) -->
                <nav class="pagination" aria-label="Pagination">
                    <button type="button" class="page-btn" aria-label="Previous page">
                        <span class="material-icons" aria-hidden="true">chevron_left</span>
                    </button>

                    <button type="button" class="page-num is-active" aria-current="page">1</button>
                    <button type="button" class="page-num">2</button>
                    <button type="button" class="page-num">3</button>

                    <button type="button" class="page-btn" aria-label="Next page">
                        <span class="material-icons" aria-hidden="true">chevron_right</span>
                    </button>
                </nav>
            </section>
        </div>
    </main>

    <!-- footer -->
    <div data-include="../components/footer.html"></div>
</body>

</html>
